name: Build and Release Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Windows application
      run: ./gradlew packageAppImageForWindows
      
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-artifacts
        path: build/compose/binaries/main/app/*.exe
        retention-days: 30
        
    - name: Build MSI package
      run: ./gradlew packageMsiForWindows
      
    - name: Upload MSI artifacts
      uses: actions/upload-artifact@v4
      with:
        name: msi-artifacts
        path: build/compose/binaries/main/app/*.msi
        retention-days: 30

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    
    steps:
    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-artifacts
        path: artifacts/windows
        
    - name: Download MSI artifacts
      uses: actions/download-artifact@v4
      with:
        name: msi-artifacts
        path: artifacts/msi
        
    - name: Get tag name
      id: tag
      uses: dawidd6/action-get-tag@v1
      if: startsWith(github.ref, 'refs/tags/')
      
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: NFVR Quest Installer v${{ steps.tag.outputs.tag || 'latest' }}
        body: |
          ## NFVR Quest Installer v${{ steps.tag.outputs.tag || 'latest' }}
          
          ### ميزات هذه النسخة:
          - ✅ دعم تثبيت الألعاب APK و OBB
          - ✅ واجهة مستخدم سهلة باللغة العربية
          - ✅ إدارة التخزين التلقائية
          - ✅ إعادة تشغيل النظارة بعد التثبيت
          - ✅ اكتشاف تلقائي للأجهزة
          - ✅ معالجة الأخطاء والتحذيرات
          
          ### كيفية التشغيل:
          1. حمل الملف المناسب (EXE أو MSI)
          2. شغّل البرنامج
          3. وصل نظارة Meta Quest عبر USB
          4. وافق على USB Debugging داخل النظارة
          5. أضف مجلدات الألعاب واضغط "تثبيت الكل"
          
          ### المتطلبات:
          - Windows 10/11
          - نظارة Meta Quest مع تفعيل Developer Mode
          - كابل USB لتوصيل النظارة
          
          ### ملاحظات:
          - البرنامج مرفق معه ADB tools
          - لا يتطلب تثبيت إضافي
          - يدعم اللغة العربية بالكامل
        files: |
          artifacts/windows/*.exe
          artifacts/msi/*.msi
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}